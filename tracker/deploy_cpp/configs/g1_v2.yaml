# G1 tracker configuration — proprio student (2-input policy: proprio + 30-frame history).
# Builds on BeyondMimic whole_body_tracking (Copyright (c) 2024, The Isaac Lab Project Developers, MIT License).
#
# Nominal G1 values of the training code (tracker/training/.../g1/robot_cfg.py, G1_29DOF_CFG): 29 joints,
# PD gains from rotor inertia (10 Hz natural frequency, damping ratio 2), action_scale =
# 0.25 * effort_limit / kp, the training default pose, 200 Hz physics with decimation 4 (50 Hz policy).
# Training simulates the lab robot's identified gains around these nominal ones.
#
# The `observation:` block below is the single source of truth for the obs layout; it mirrors the
# student observation groups of tracker/training/.../g1/motion_tracking_scene_distill_cfg.py and defines
# TWO ONNX inputs:
#   obs             flat  (1, 434)      proprio + 5-frame tracking horizon + anchor orientation
#   policy_temporal stack (1, 30, 166)  the same terms, 30-frame history
# For the depth student use g1_v2_depth.yaml (the Python counterpart is
# tracker/deploy/g1/configs/g1_v2_depth.yaml).
#
# NOTES
#   * `xml_path` is the lab robot that training simulates (Mac mini backpack and head cameras,
#     identified armature, joint friction and torque limits):
#     assets/robots/g1/mjcf/g1_29dof_macmini_sysid.xml, the MuJoCo twin of
#     assets/robots/g1/urdf/g1_29dof_macmini_sysid.urdf.
#   * `max_torque` holds the G1 motor torque ratings (see the Torque Limits block). The MJCF
#     actuator range (the identified limits) is the sim's hard motor cap; per joint the tighter
#     of the two applies.

# ========== Robot Identification ==========
robot_name: g1

# ========== MuJoCo Model Path ==========
xml_path: '{ROOT_DIR}/assets/robots/g1/mjcf/scene_g1_29dof_macmini_sysid.xml'

# ========== Simulation Timing ==========
simulation_dt: 0.005
control_decimation: 4

# ========== Timing ==========
control_dt: 0.02          # 50 Hz control frequency

# ========== Dimensions and clipping ==========
