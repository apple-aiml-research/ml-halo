# ---------------------------------------------------------------------------
# Observation spec (config-driven ObservationBuilder). This is the SINGLE
# source of truth for the obs layout: the ObservationBuilder assembles the ONNX
# feed tensors from this block (the Python controller, tracker/deploy/g1/
# g1_controller.py, reads the same block from its own config).
#
# groups map 1:1 to ONNX inputs (name -> tensor). Term order is significant.
#   flat  group -> (1, sum(dims))            [actor input "obs"]
#   stack group -> (1, history, sum(dims))   [temporal CNN input]
# Reference terms (tracking_command_partial) are sampled from the loaded motion;
# `horizon: K` (flat) takes the current frame and the next K-1 frames, ordered
# t+K-1 ... t (current frame last), flattened `term_major` (each subfield over
# all K frames, then the next subfield).
# ---------------------------------------------------------------------------
observation:
  anchor_mode: odom      # required; the only supported value (anchor = odometry pose)
  history_length: 30
  groups:
    obs:
      layout: flat
      terms:
        - base_ang_vel          # 3
        - proj_gravity          # 3
        - joint_pos_rel         # 29
        - joint_vel_rel         # 29
        - last_action           # 29
        - {name: tracking_command_partial, horizon: 5, flatten: term_major}  # 5*67=335
        - motion_anchor_ori_b   # 6      -> total 434
    policy_temporal:
      layout: stack
      history: 30
      terms:
        - base_ang_vel          # 3
        - proj_gravity          # 3
        - joint_pos_rel         # 29
        - joint_vel_rel         # 29
        - last_action           # 29
        - motion_anchor_ori_b   # 6
        - {name: tracking_command_partial}   # 67  -> per-frame 166, stacked (30,166)
    # Depth student 3rd input: torso depth frame, encoded clip([0.2,2.5] m)->log1p
    # ->(1,1,48,84). 'image' layout — a raw metric DepthFrame handed to the
    # ObservationBuilder via set_depth() (RealSense D435i on real), NOT proprio
    # terms. Group name MUST equal the ONNX input name. H*W must equal
    # DepthFrame::kCount (48*84=4032).
    student_depth:
      layout: image
      height: 48
      width: 84
      # ENCODE clip [near_m, far_m] — the obs contract. MANDATORY, no default.
      #
      # Must equal training's DEPTH_CLIP (tracker/training/.../g1/
      # motion_tracking_scene_distill_cfg.py).
      #
      # Getting this wrong is silent: the tensor shape and the ONNX signature
      # still match while every pixel is mis-scaled, and invalid / no-return
      # pixels (encoded at the far clip) dominate a real D435i. At start-up
      # g1/depth_clip_registry.cpp checks this value against the training clip
      # and refuses to run on a mismatch (--allow_depth_clip_mismatch overrides).
      #
      # depth_d435i.yaml's clip_min_m/clip_max_m MUST equal these two numbers
      # (apps/g1/depth_setup.hpp refuses to start a producer if they disagree).
      clip: [0.2, 2.5]
      # Control steps each depth frame is HELD for => depth at 50/N Hz.
      #
      # 2 (25 Hz) is what the tracker trains with (obs_decim=2 in the training
      # depth term).
      #
      # APPLIED IN SIM ONLY, and that asymmetry is deliberate:
      #   sim       a renderer synchronous with the control loop would emit a
      #             fresh frame every tick = twice the training rate on the only
      #             exteroceptive input, so the sim decimates its render cadence.
      #   hardware  NOT applied. The D435i is asynchronous and already slower
      #             than 50 Hz, so the sensor rate IS the hold; the correct
      #             frame is the newest one and holding on top would only add
      #             latency.
      obs_decim: 2
      encode: log1p
