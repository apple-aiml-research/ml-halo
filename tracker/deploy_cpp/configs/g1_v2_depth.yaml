# G1 tracker configuration — depth student (3-input policy: proprio + history + depth)
# Builds on BeyondMimic whole_body_tracking (Copyright (c) 2024, The Isaac Lab Project Developers, MIT License).
# Motion tracking with standard PD control, plus a depth observation from the
# torso-mounted D435i.
#
# This is g1_v2.yaml with a `student_depth` group added to the observation spec.
# Everything numeric outside that group (29 joints, PD gains,
# action_scale, default pose, torque limits, joint orders) is inherited verbatim.
#
# The `observation:` block below is the single source of truth for the obs
# layout, and it defines THREE ONNX inputs:
#   obs             flat  (1, 434)      proprio + 5-frame tracking horizon + anchor
#   policy_temporal stack (1, 30, 166)  the same terms, 30-frame history
#   student_depth   image (1, 1, 48, 84) clip[0.2,2.5] m -> log1p
# So this file REQUIRES a 3-input policy export. A 1- or 2-input .plan/.onnx is
# rejected at ControlLoop construction rather than silently zero-filled.
#
# On the robot the depth frames come from the D435i producer configured by
# configs/depth_d435i.yaml (rt_deploy::vision, built with
# -DRT_DEPLOY_WITH_REALSENSE=ON): `deploy_g1_real --depth_config
# configs/depth_d435i.yaml` starts it and feeds the control loop's depth inbox.
# In sim, `deploy_g1_mujoco --depth_render` renders the same input. Without a
# depth source this config is refused at start (kConfigError), except under
# deploy_g1_real --no_send (dry run: far plane fed, warning logged). See
# docs/depth.md.
#
# NOTES
#   * `xml_path` is the same as g1_v2.yaml: scene_g1_29dof_macmini_sysid.xml, the lab
#     robot that training simulates. It has no depth camera; `deploy_g1_mujoco --depth_render`
#     injects the depth camera on torso_link at load (MjSpec) to render the
#     student_depth input; without that flag this config is refused at start.
#   * `max_torque` holds the G1 motor torque ratings (see the Torque Limits block).
#     The MJCF actuator range (the identified limits) is the sim's hard motor cap; per
#     joint the tighter of the two applies.

