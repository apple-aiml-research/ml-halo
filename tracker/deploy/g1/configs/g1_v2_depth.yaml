# ---------------------------------------------------------------------------
# Observation spec (utils/core/observation_builder.py). The single source of
# truth for the obs layout: G1Controller assembles the ONNX feed tensors from
# this block and checks the group names against the policy's ONNX inputs.
#
# groups map 1:1 to ONNX inputs (name -> tensor). Term order is significant.
#   flat  group -> (1, sum(dims))            [actor input "obs"]
#   stack group -> (1, history, sum(dims))   [temporal CNN input]
# Reference terms (tracking_command_partial) are sampled from the loaded motion.
# `horizon: K` (flat) takes the current reference frame and the next K-1 frames,
# in the order t+K-1, ..., t+1, t (current frame last), flattened `term_major`.
# ---------------------------------------------------------------------------
observation:
  anchor_mode: odom
  history_length: 30
  groups:
    obs:
      layout: flat
      terms:
        - base_ang_vel          # 3
        - proj_gravity          # 3
        - joint_pos_rel         # 29
        - joint_vel_rel         # 29
        - last_action           # 29
        - {name: tracking_command_partial, horizon: 5, flatten: term_major}  # 5*67=335
        - motion_anchor_ori_b   # 6      -> total 434
    policy_temporal:
      layout: stack
      history: 30
      terms:
        - base_ang_vel          # 3
        - proj_gravity          # 3
        - joint_pos_rel         # 29
        - joint_vel_rel         # 29
        - last_action           # 29
        - motion_anchor_ori_b   # 6
        - {name: tracking_command_partial}   # 67  -> per-frame 166, stacked (30,166)
    # ── third ONNX input for the depth student ───────────────────────────────────────────────
    # A single torso-camera depth frame, encoded clip([0.2, 2.5] m) -> log1p -> (1,1,48,84).
    # The group name MUST equal the ONNX input name (G1Controller checks the group names against
    # the loaded policy's inputs, so a typo fails at construction).
    student_depth:
      layout: image            # frame handed in via ObservationBuilder.set_depth_from(...)
      height: 48
      width: 84
      # THE CLIP IS A TRAINED CONTRACT, NOT A TUNABLE: it must equal training's DEPTH_CLIP
      # (motion_tracking_scene_distill_cfg.py). A wrong clip rescales every pixel while the tensor
      # shapes and the ONNX signature still match, so nothing downstream can detect it;
      # variant_support.check_depth_clip refuses to start on a mismatch.
      clip: [0.2, 2.5]
      encode: log1p            # clip FIRST, then log1p
      # 25 Hz depth: hold each frame for 2 control steps in sim, as in training (obs_decim=2 in the
      # training depth term). Hardware always takes the freshest camera frame.
      obs_decim: 2

# ---------------------------------------------------------------------------
# Depth camera (sim only) — the training camera mount, injected into the MuJoCo model by
# variant_support.compile_scene_with_depth_camera (no robot XML carries it). The rendered
# size and the far fill value come from observation.groups.student_depth.
# ---------------------------------------------------------------------------
depth_camera:
  render_camera: depth_cam          # name of the injected MuJoCo camera
  parent_body: torso_link
  pos: [0.054058, 0.033836, 0.433928]                          # training OffsetCfg (torso frame; measured D435i mount)
  quat_wxyz_world: [0.903525, -0.004587, 0.428507, -0.001531]  # IsaacLab 'world' convention; converted to MuJoCo's camera frame
  fovy: 59.26                       # training VFOV (focal 24mm / aperture 47.78mm @ 84x48); NOT the D435 module's 58
