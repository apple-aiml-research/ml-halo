# G1 tracker configuration — depth student (3-input policy: proprio + history + torso depth).
# Builds on BeyondMimic whole_body_tracking (Copyright (c) 2024, The Isaac Lab Project Developers, MIT License).
#
# g1_v2.yaml plus the `student_depth` observation group and the `depth_camera:` block; every
# control block (joint orders, default_angles, action_scale, joint_kps/kds, max_torque, timing,
# anchor_mode) is identical. ONNX inputs:
#   obs             flat  (1, 434)
#   policy_temporal stack (1, 30, 166)
#   student_depth   image (1, 1, 48, 84)  clip[0.2, 2.5] m -> log1p
#
# deploy_mujoco.py injects the training depth camera described by `depth_camera:` and renders
# it; deploy_real.py reads a RealSense D435i in-process (pyrealsense2). `xml_path` is the lab robot
# that training simulates (see g1_v2.yaml).

