# Qwen3.5-2B + DiT decoder, prev_chunk inpainting, 5-second (150-frame) plans.
# Spatial vision-language conditioning: all 64 image tokens (8x8 grid) plus every
# text token of the instruction go to the DiT cross-attention, with a learned
# positional embedding over the conditioning tokens (cond_pos_embed) so the
# image layout (left vs right) is visible. Global batch 5120 on 64 GPUs.
#
# FINE-TUNED Qwen: the whole VLM (vision tower + language model) trains at
# vlm_lr 1e-5 in fp32 (AdamW master weights); the DiT trains at 1e-3. Qwen
# image preprocessing on the GPU, TF32 enabled.
#
# VISION DROPOUT: each training sample's RGB is replaced by a black frame with
# p=0.3 before the VLM, so the image tokens (and the text tokens, which see the
# image inside the causal LM) carry no scene and the DiT must act from the
# instruction alone. This counters checkpoints that ignore the text prompt.
# Evaluation / inference never drop.

experiment_name: "halo_qwen3.5_2b_dit_vision_finetune_vdrop"
seed: 42
device: "cuda"

data:
  # The training dataset generated by datagen/ (see ../datagen/README.md): an s3:// URI,
  # streamed chunk by chunk, or a local directory with streaming_chunk_size: 0.
  data_dir: "s3://your-bucket/halo/<dataset>"
  image_size: [224, 224]
  trajectory_length: 150
  train_split: 0.9
  # 40 x 64 GPUs x accum 2 = 5120 global batch (80 x 1 is data-loader bound).
  batch_size: 40
  num_workers: 24
  pin_memory: true
  normalize_motion: true
  cache_frames: false
  streaming_chunk_size: 3400
  cold_start_augment: true

model:
  vlm_backbone: "qwen3.5-2b"
  vlm_frozen: true
  vlm_dtype: "bfloat16"
  max_cond_tokens: 96
  # Whole Qwen trainable: vision tower + language model.
  vlm_vision_trainable: true
  vlm_lm_trainable: true
  vision_dropout: 0.3          # black RGB for 30% of training samples (see header)
  cond_pos_embed: true
  # Qwen image preprocessing on the GPU (tokens identical to the CPU path).
  vlm_gpu_preprocess: true

  num_inference_steps: 15
  hidden_dim: 512
  num_decoder_layers: 8
  num_heads: 8
  dropout: 0.1
  trajectory_length: 150
  output_dim: 36

  inpaint_prev_chunk: true
  prev_chunk_frames: 15

training:
  num_epochs: 50
  accumulation_steps: 2     # 40 x 64 GPUs x 2 = 5120
  learning_rate: 0.001
  # Qwen is PRETRAINED: 1e-3 would destroy it in the first steps. It gets its
  # own AdamW group (training/trainer.py) at this LR.
  vlm_lr: 0.00001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  max_grad_norm: 1.0
  # TF32 tensor cores for the fp32 VLM.
  allow_tf32: true
  checkpoint_dir: "./checkpoints_qwen2b_dit_vision_finetune_vdrop"
  checkpoint_every: 1
  eval_every: 5
