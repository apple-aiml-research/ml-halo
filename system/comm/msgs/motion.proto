syntax = "proto3";

// Motion-plan / trim domain for the halo_comm middleware.
//
// Used by the `g1/put_plan` service (MotionPlan -> PlanAck) and the
// `g1/get_trim` service (TrimRequest -> TrimReply).
//
// Plan/trim rows are a flat, packed double array (row-major), `cols` wide —
// the closest protobuf encoding to the legacy contiguous tobytes() layout and
// the cheapest on the wire. Each row is:
//   [base_xyz(3), base_quat_xyzw(4), joints_deploy(29)]  => cols = 36
// Quaternion order here is xyzw (matches the legacy plan wire; note RobotState
// uses wxyz — kept per-field on purpose, do NOT unify).
//
// Field-number stability is the contract — never renumber or reuse a tag.

package motion_msgs;

// ── put_plan ────────────────────────────────────────────────────────────────

message MotionPlan {
  int32           input_fps = 1;             // generator sampling rate
  uint32          flags     = 2;             // kFlagAlignYaw=1<<0, kFlagAutoStartOffset=1<<1 (bit 1<<2 reserved)
  int32           cols      = 3;             // always 36
  repeated double values    = 4 [packed = true];  // n_rows * cols, row-major
}

message PlanAck {
  bool   ok           = 1;
  reserved 2, 3;
  string reason       = 4;                   // populated on error
}

// ── get_trim ──────────────────────────────────────────────────────────────────

message TrimRequest {}

message TrimReply {
  int32           input_fps  = 1;
  reserved 2;
  int32           cols       = 3;            // always 36
  repeated double values     = 4 [packed = true];  // n_rows*cols; empty => exhausted
}

// ── g1/mission ──────────────────────────────────────────────────────────────
// Mission orchestrator (System-2 VLM) -> generator. The orchestrator chooses the next
// subtask from the ego view; the generator swaps its active prompt to `prompt`.
message MissionCommand {
  int32  subtask_id = 1;   // 0..N-1 index into the available subtasks
  string subtask    = 2;   // subtask name, e.g. "crawl_under"
  string prompt     = 3;   // full generator prompt for this subtask
  string reason     = 4;   // short VLM justification (logging)
  bool   done       = 5;   // mission complete
  int32  tick       = 6;   // orchestrator decision counter
  double stamp      = 7;   // orchestrator wall-clock seconds
  string why        = 8;   // latest step-decision line (`say`); the viewer shows it in the chat
}

// ── g1/plan ───────────────────────────────────────────────────────────────────
// The checkpoint checklist ON THE WIRE. Published by the orchestrator on every install, so the
// live viewer reads it from the wire and never from the orchestrator's filesystem; a plan that
// is not being published simply stops arriving.
message PlanStepMsg {
  string id       = 1;
  string subtask  = 2;
  string title    = 3;
  string status   = 4;   // pending|in_progress|completed|failed|skipped
  reserved 5, 6, 7;
}

message MissionPlanMsg {
  reserved 1;
  string run_id           = 2;
  int32  version          = 3;
  int32  revision         = 4;
  double stamp            = 5;
  string mission          = 6;
  reserved 7;
  bool   authored         = 8;
  reserved 9, 10, 11;
  int32  current          = 12;
  bool   done             = 13;
  repeated PlanStepMsg steps = 14;
  // T1's answer to the operator (its only prose).
  string reply = 15;
}

// ── g1/gen_status ─────────────────────────────────────────────────────────────
// Generator -> mission orchestrator. Carries the latest plan's joint activity, the active
// subtask and the planned travel. Published once per generated plan.
message GenStatus {
  reserved 1, 3, 5, 6;
  double joint_activity = 2;   // plan joint-activity metric (higher = more motion)
  string subtask        = 4;   // active subtask/prompt the generator is running
  double plan_travel    = 7;   // planned pelvis XY displacement over the plan (m); a slow
                              // sidestep has low joint activity but still travels
}
