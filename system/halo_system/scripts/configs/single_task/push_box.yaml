# push_box: single task in the bedroom scene. Push the box; starts 1.3 m behind it and pushes it away from the door.
#   python system/halo_system/scripts/run_sim.py --task_config system/halo_system/scripts/configs/single_task/push_box.yaml --web
name: task_push_box
agentic: false
prompt: push box
instruction: ''
scene_xml: assets/scenes/bedroom/bedroom.xml
start:
  pos:
  - 6.400
  - 4.300
  - 0.79
  yaw: -90.0
# Models: not in the repository. Replace each <...> with your own file (see "Tasks" in
# system/README.md). One generator and one tracker serve every subtask.
checkpoint: <your_generator_checkpoint.pt>   # generator weights
gen_config: <your_generator_config.yaml>     # the generator config the checkpoint was trained with
policy_path: <your_tracker_policy.onnx>     # tracker policy ONNX with a depth input (pairs with robot_config)
robot_config: tracker/deploy_cpp/configs/g1_v2_depth_sim.yaml
duration: 0
initial_subtask: push_box
subtasks:
  push_box:
    prompt: push box
orchestrator:
  enabled: false
hide_bodies:   # objects this skill does not use
- human
- chair
- object5_root
